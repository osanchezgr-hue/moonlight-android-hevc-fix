name: Build Moonlight HEVC+Keys APK

on:
  push:
    branches: [ "hevc-keys" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager and install packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Verify known-good HEVC core is unchanged
        shell: bash
        run: |
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.java)" = "27433003f9ec3d60a96a17f3abf0606aa98eb7ae"
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecHelper.java)" = "d1067b19f5a576fc02a605666eee32edd7aac00f"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-hevc-keys
          path: app/build/outputs/apk/nonRoot/debug/*.apk
