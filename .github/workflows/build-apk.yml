name: Build Moonlight HEVC+Keys APK

on:
  push:
    branches: [ "hevc-keys" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK manager and install packages
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"

      - name: Restore persistent signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moonlight-hevc-keys.p12"
          test -s "$RUNNER_TEMP/moonlight-hevc-keys.p12"

      - name: Verify known-good HEVC core and v4 keyboard cleanup
        shell: bash
        run: |
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.java)" = "d24ec0dc721587382d2c68860543e43d8a820f89"
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecHelper.java)" = "6e1dd6ce6162eb45d539708e08e87d5664fd20e3"
          grep -q 'public static final int VK_PRINTSCREEN = 0x2C;' app/src/main/java/com/limelight/binding/input/KeyboardTranslator.java
          ! grep -q 'ctrlAltActivityFallbackKeys' app/src/main/java/com/limelight/Game.java
          ! grep -q 'isFunctionPressed()' app/src/main/java/com/limelight/Game.java

      - name: Build persistently signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/moonlight-hevc-keys.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/nonRoot/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-hevc-keys-v4
          path: app/build/outputs/apk/nonRoot/debug/*.apk
