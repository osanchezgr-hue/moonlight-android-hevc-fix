name: Build Moonlight HEVC+Keys APK

on:
  push:
    branches: [ "hevc-keys" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Verify known-good HEVC core is unchanged
        shell: bash
        run: |
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecDecoderRenderer.java)" = "27433003f9ec3d60a96a17f3abf0606aa98eb7ae"
          test "$(git hash-object app/src/main/java/com/limelight/binding/video/MediaCodecHelper.java)" = "d1067b19f5a576fc02a605666eee32edd7aac00f"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-hevc-keys
          path: app/build/outputs/apk/nonRoot/debug/*.apk
